name: CI/CD Pipeline - Identifica Tu Fraude (SAFE-HAI Audit & Bot Runner)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite encender/apagar manualmente desde la pestaña Actions de GitHub

jobs:
  audit-and-test:
    name: Auditoría SAFE-HAI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Auditoría de Gobernanza SAFE-HAI
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        AUTONOMY_LEVEL: ${{ secrets.AUTONOMY_LEVEL }}
      run: |
        python -m src.governance.safe_eval

  run-telegram-bot:
    name: Servidor Bot Telegram en la Nube
    needs: audit-and-test
    if: github.event_name == 'workflow_dispatch' # Solo se ejecuta cuando lo enciendes manualmente
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Iniciar Bot de Telegram
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        AUTONOMY_LEVEL: ${{ secrets.AUTONOMY_LEVEL }}
        PYTHONUNBUFFERED: "1"
      run: |
        python -m src.main